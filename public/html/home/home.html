<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABYSITE - Home</title>
  <link rel="icon" href="../../imagens/logo_do_babysite.png" type="image/png">

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- CSS com base na estrutura da imagem -->
  <link rel="stylesheet" href="../../css/global/fundo.css">
  <link rel="stylesheet" href="../../css/home/home.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Header / Navbar Superior -->
  <header class="bg-custom-header py-2 px-3 shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between flex-wrap gap-2">
      
      <!-- Logo -->
      <a class="navbar-brand p-0 m-0 d-flex align-items-center">
        <img src="../../imagens/logo_do_babysite.png" alt="BABYSITE" class="logo-img">
      </a>

      <!-- Barra de Pesquisa -->
      <div class="flex-grow-1 mx-md-4 my-2 my-md-0 search-container">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
            <i class="bi bi-search text-muted"></i>
          </span>
          <input type="text" class="form-control border-start-0 rounded-end-pill py-2" placeholder="pesquise">
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-light fw-bold text-dark d-flex align-items-center gap-2 shadow-sm rounded-3 px-3 py-2 text-decoration-none">
          <img src="../../imagens/home/cadastrar_pais.png" alt="Pais" width="22" height="22">
          Cadastrar como Pais
        </a>

        <a class="btn btn-light fw-bold text-dark d-flex align-items-center gap-2 shadow-sm rounded-3 px-3 py-2 text-decoration-none">
          <img src="../../imagens/home/cadastrar_baba.png" alt="Babá" width="22" height="22">
          Cadastrar como Babá
        </a>

        <a class="btn btn-light fw-bold text-dark d-flex align-items-center gap-2 shadow-sm rounded-3 px-3 py-2 text-decoration-none">
          <img src="../../imagens/home/entrar.png" alt="Cadeado" width="18" height="18">
          Entrar
        </a>
      </div>

    </div>
  </header>

  <!-- Barra de Filtros -->
  <section class="bg-custom-filter py-3 px-4 shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between flex-wrap gap-3">
      
      <div class="text-custom-title fst-italic fw-bold fs-5">
        Faça Login/Cadastro primeiro
      </div>

      <!-- Filtro: Estado -->
      <div class="d-flex flex-column gap-1">
        <label class="form-label mb-0 fw-bold small text-secondary">Estado (PB, SP, etc.)</label>
        <div class="input-group input-group-sm filter-state-input">
          <input type="text" class="form-control rounded-start-2" placeholder="Ex: PB">
          <span class="input-group-text rounded-end-2"><i class="bi bi-map"></i></span>
        </div>
      </div>

      <!-- Filtro: Disponibilidade -->
      <div class="d-flex flex-column gap-1">
        <label class="form-label mb-0 fw-bold small text-secondary">Disponibilidade</label>
        <div class="d-flex gap-3 bg-white bg-opacity-75 px-3 py-1 rounded-2 border">
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="checkbox" id="seg">
            <label class="form-check-label small" for="seg">seg</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="checkbox" id="sex">
            <label class="form-check-label small" for="sex">sex</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="checkbox" id="ter">
            <label class="form-check-label small" for="ter">ter</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="checkbox" id="dom">
            <label class="form-check-label small" for="dom">dom</label>
          </div>
        </div>
      </div>

      <!-- Filtro: Tipo de Cuidado -->
      <div class="d-flex flex-column gap-1">
        <label class="form-label mb-0 fw-bold small text-secondary">Tipo de Cuidado</label>
        <div class="d-flex gap-3 bg-white bg-opacity-75 px-3 py-1 rounded-2 border">
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="checkbox" id="ter-cuidado">
            <label class="form-check-label small" for="ter-cuidado">ter</label>
          </div>
          <div class="form-check form-check-inline m-0">
            <input class="form-check-input" type="checkbox" id="dom-cuidado">
            <label class="form-check-label small" for="dom-cuidado">dom</label>
          </div>
        </div>
      </div>

      <!-- Filtro: Tarifa -->
      <div class="d-flex flex-column gap-1">
        <label class="form-label mb-0 fw-bold small text-secondary">Tarifa (por hora)</label>
        <div class="fw-bold text-dark">
          R$10 &nbsp;—&nbsp; R$80+
        </div>
      </div>

    </div>
  </section>

  <!-- Vitrine de Cards -->
  <main class="container py-5 flex-grow-1">
    <div class="d-flex align-items-center justify-content-center gap-3">
      
      <button class="btn btn-arrow flex-shrink-0" aria-label="Anterior">
        <i class="bi bi-chevron-left fs-5"></i>
      </button>

      <!-- Grid de Babás -->
      <div class="row g-4 w-100 justify-content-center">
        
        <!-- Card 1 -->
        <div class="col-12 col-md-6 col-lg-4 card-max-width">
          <div class="card custom-card h-100 shadow-sm border-0">
            <div class="card-person-placeholder bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center">
              <i class="bi bi-person-fill text-secondary display-1"></i>
            </div>
            <div class="card-body">
              <h5 class="card-title fw-bold mb-1">
                Luciana <span class="fw-normal text-muted fs-6">(18 m. exp.)</span>
              </h5>
              <div class="text-custom-price fs-5 my-1">R$45/hr</div>
              <p class="card-text text-secondary small mb-0">Disponibilidade: 128 hr</p>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="col-12 col-md-6 col-lg-4 card-max-width">
          <div class="card custom-card h-100 shadow-sm border-0">
            <div class="card-person-placeholder bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center">
              <i class="bi bi-person-fill text-secondary display-1"></i>
            </div>
            <div class="card-body">
              <h5 class="card-title fw-bold mb-1">
                Ana <span class="fw-normal text-muted fs-6">(24 m. exp.)</span>
              </h5>
              <div class="text-custom-price fs-5 my-1">R$45/hr</div>
              <p class="card-text text-secondary small mb-0">Disponibilidade: 14 hr</p>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="col-12 col-md-6 col-lg-4 card-max-width">
          <div class="card custom-card h-100 shadow-sm border-0">
            <div class="card-person-placeholder bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center">
              <i class="bi bi-person-fill text-secondary display-1"></i>
            </div>
            <div class="card-body">
              <h5 class="card-title fw-bold mb-1">
                Marina <span class="fw-normal text-muted fs-6">(12 m. exp.)</span>
              </h5>
              <div class="text-custom-price fs-5 my-1">R$45/hr</div>
              <p class="card-text text-secondary small mb-0">Disponibilidade: 124 hr</p>
            </div>
          </div>
        </div>

      </div>

      <button class="btn btn-arrow flex-shrink-0" aria-label="Próximo">
        <i class="bi bi-chevron-right fs-5"></i>
      </button>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
