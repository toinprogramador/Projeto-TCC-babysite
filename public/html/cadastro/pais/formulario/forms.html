<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pais - BABYSITE</title>
  <link rel="icon" href="../../../../imagens/logo_do_babysite.png" type="image/png">

  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Estilos Customizados (Caminho corrigido) -->
  <link rel="stylesheet" href="../../../../css/cadastro/cadastro.css">
  <link rel="stylesheet" href="../../../../css/cadastro/pais/formulario/forms.css">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Header Superior -->
  <header class="bg-custom-header py-2 px-4 shadow-sm d-flex align-items-center justify-content-between">
    <a href="../../../home/home.html" class="navbar-brand p-0 m-0">
      <img src="../../../../imagens/logo_do_babysite.png" alt="BABYSITE" class="logo-img">
    </a>
    <h2 class="text-white fw-bold mb-0 fs-3">Faça seu Cadastro!</h2>
  </header>

  <!-- Conteúdo Principal Centralizado -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="card card-custom-form shadow-lg border-0 p-4 w-100">
      
      <!-- Progresso da Etapa -->
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="small fw-bold text-secondary">Passo 1 de 3</span>
        <span class="small fw-bold text-secondary">Dados Básicos</span>
      </div>
      <div class="progress mb-4" style="height: 6px;">
        <div class="progress-bar bg-custom-purple" role="progressbar" style="width: 33%;"></div>
      </div>

      <!-- Formulário Passo 1 -->
      <form action="passo2.html" method="GET">
        <!-- Nome Completo -->
        <div class="mb-3">
          <label for="nome" class="form-label fw-bold small text-dark mb-1">Nome Completo:</label>
          <input type="text" class="form-control custom-input" id="nome" placeholder="Ex: Maria Oliveira" required>
        </div>

        <!-- CPF e Telefone -->
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label for="cpf" class="form-label fw-bold small text-dark mb-1">CPF:</label>
            <input type="text" class="form-control custom-input" id="cpf" placeholder="000.000.000-00" required>
          </div>
          <div class="col-6">
            <label for="telefone" class="form-label fw-bold small text-dark mb-1">Telefone/Zap:</label>
            <input type="tel" class="form-control custom-input" id="telefone" placeholder="(00) 00000-0000" required>
          </div>
        </div>

        <!-- E-mail Principal -->
        <div class="mb-3">
          <label for="email" class="form-label fw-bold small text-dark mb-1">E-mail Principal:</label>
          <input type="email" class="form-control custom-input" id="email" placeholder="nome@email.com" required>
        </div>

        <!-- E-mail Reserva -->
        <div class="mb-4">
          <label for="email_reserva" class="form-label fw-bold small text-dark mb-1">E-mail Reserva (Opcional):</label>
          <input type="email" class="form-control custom-input" id="email_reserva" placeholder="outro@email.com">
        </div>

        <!-- Botão Avançar -->
        <button type="submit" class="btn btn-purple w-100 fw-bold py-2 rounded-3 shadow-sm">
          AVANÇAR &rarr;
        </button>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
