<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABYSITE - Cadastro de Pais (Passo 2)</title>
  <link rel="icon" href="../../../../imagens/logo_do_babysite.png" type="image/png">

  <!-- Bootstrap CSS e Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- CSS Global e CSS do Formulário -->
  <link rel="stylesheet" href="../../../../css/cadastro/cadastro.css">
  <link rel="stylesheet" href="../../../../css/cadastro/pais/formulario/forms.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header Global -->
  <header class="bg-custom-header py-2 px-4 shadow-sm d-flex align-items-center justify-content-between">
    <a href="../../../home/home.html" class="navbar-brand p-0 m-0">
      <img src="../../../../imagens/logo_do_babysite.png" alt="BABYSITE" class="logo-img">
    </a>
    <h2 class="text-white fw-bold mb-0 fs-3">Faça seu Cadastro!</h2>
  </header>

  <!-- Card do Passo 2 -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="card card-custom-form shadow-lg border-0 p-4 w-100">
      
      <!-- Barra de Progresso -->
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span class="small fw-bold text-secondary">Passo 2 de 3</span>
        <span class="small fw-bold text-secondary">Foto de Perfil</span>
      </div>
      <div class="progress mb-4" style="height: 6px;">
        <div class="progress-bar bg-custom-purple" role="progressbar" style="width: 66%;"></div>
      </div>

      <!-- Formulário de Upload -->
      <form action="passo3.html" method="GET">
        <div class="text-center mb-4">
          <label class="form-label fw-bold small d-block mb-3">Escolha sua Foto de Perfil:</label>
          
          <div class="position-relative d-inline-block">
            <div class="avatar-preview-wrapper shadow-sm mx-auto">
              <i class="bi bi-person-fill text-secondary display-4" id="preview-placeholder"></i>
              <img id="img-preview" src="#" alt="Preview" class="w-100 h-100 object-fit-cover d-none">
            </div>
            <label for="foto_perfil" class="btn btn-purple btn-upload-icon position-absolute bottom-0 end-0 shadow" style="cursor: pointer;">
              <i class="bi bi-camera-fill"></i>
            </label>
            <input type="file" id="foto_perfil" name="foto_perfil" accept="image/*" class="d-none">
          </div>

          <div class="form-text text-muted small mt-3">
            Uma foto de perfil ajuda as babás a identificarem você com mais facilidade.
          </div>
        </div>

        <!-- Botões de Navegação -->
        <div class="d-flex gap-2 mt-4">
          <a href="passo1.html" class="btn btn-outline-secondary w-50 fw-bold py-2 rounded-3">
            &larr; VOLTAR
          </a>
          <button type="submit" class="btn btn-purple w-50 fw-bold py-2 rounded-3 shadow-sm">
            AVANÇAR &rarr;
          </button>
        </div>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Script do Preview de Imagem -->
  <script src="../../../js/cadastro/pais/perfil/perfil.js"></script>
</body>
</html>
