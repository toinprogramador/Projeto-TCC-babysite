<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABYSITE - Criar Senha</title>
  <link rel="icon" href="../../../../imagens/logo_do_babysite.png" type="image/png">

  <!-- Bootstrap CSS e Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../../../../css/cadastro/cadastro.css">
  <link rel="stylesheet" href="../../../../css/cadastro/pais/formulario/forms.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header Amarelo/Dourado -->
  <header class="bg-header-yellow py-2 px-4 shadow-sm d-flex align-items-center">
    <a href="../../../home/home.html" class="navbar-brand me-3">
      <img src="../../../../imagens/logo_do_babysite.png" alt="BABYSITE" class="logo-img-header">
    </a>
    <h2 class="text-white fw-bold mb-0 fs-3">Criar Senha</h2>
  </header>

  <!-- Card Central de Senha -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="card card-beige-form shadow-md border-0 p-4 w-100 text-center">
      
      <h3 class="fw-bold title-dark mb-2">Crie uma Senha Segura</h3>
      <p class="subtitle-text mb-4 px-2">
        Defina uma senha para proteger sua conta (mínimo 8 caracteres, incluindo letras, números e símbolos).
      </p>

      <form action="../../../home/home.html" method="POST" id="form-passo3">
        
        <!-- Input Nova Senha -->
        <div class="mb-3 input-group-custom">
          <span class="input-label">Nova Senha:</span>
          <div class="input-wrapper">
            <input type="password" id="senha" class="custom-field" placeholder="[Digite sua nova senha]" required>
            <button type="button" class="btn-eye" id="toggleSenha">
              <i class="bi bi-eye-slash" id="iconSenha"></i>
            </button>
          </div>
        </div>

        <!-- Input Confirmar Senha -->
        <div class="mb-3 input-group-custom">
          <span class="input-label">Confirmar Senha:</span>
          <div class="input-wrapper">
            <input type="password" id="confirmar_senha" class="custom-field" placeholder="[Digite sua senha novamente]" required>
            <button type="button" class="btn-eye" id="toggleConfirmar">
              <i class="bi bi-eye-slash" id="iconConfirmar"></i>
            </button>
          </div>
        </div>

        <!-- Checkbox Termos -->
        <div class="d-flex align-items-center justify-content-center gap-1 mb-4 small text-dark">
          <input class="form-check-input mt-0" type="checkbox" id="termos" required>
          <label for="termos" class="mb-0">
            Ao criar esta senha, eu aceito os <a href="#" class="link-dark fw-bold text-decoration-underline">Termos de Uso</a> e a <a href="#" class="link-dark fw-bold text-decoration-underline">Política de Privacidade</a>.
          </label>
          <i class="bi bi-info-circle text-muted ms-1" title="Informações dos termos"></i>
        </div>

        <!-- Botões de Ação -->
        <div class="d-flex justify-content-center gap-3">
          <a href="passo2.html" class="btn btn-outline-brown rounded-pill px-4 py-2 font-weight-bold">
            &larr; Voltar para Fotos
          </a>
          <button type="submit" class="btn btn-purple-bright rounded-pill px-4 py-2 font-weight-bold text-white shadow-sm">
            CRIAR CONTA
          </button>
        </div>

      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../../../js/cadastro/pais/formulario/passo3.js"></script>
</body>
</html>
